<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Laklak</title>
  <defs>
    <!-- Pink earcup to turquoise mic, blended in OKLCH so it never goes grey in the middle. -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0609e"/>
      <stop offset="0.25" stop-color="#c97eed"/>
      <stop offset="0.5" stop-color="#88a2ff"/>
      <stop offset="0.75" stop-color="#26c3fb"/>
      <stop offset="1" stop-color="#30d5c8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- The headset L: earcup on top, boom arm as stem and foot, mic at the foot's end. -->
  <g transform="translate(256 256) scale(2.836) translate(-39 -52.5)" fill="#1e1f22">
    <rect x="0" y="0" width="38" height="46" rx="16"/>
    <path d="M19 38V73Q19 89 35 89H61" fill="none" stroke="#1e1f22" stroke-width="22" stroke-linecap="round"/>
    <rect x="44" y="73" width="34" height="32" rx="16"/>
  </g>
</svg>
