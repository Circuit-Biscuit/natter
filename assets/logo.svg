<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Laklak</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2040"/>
      <stop offset="0.5" stop-color="#1a1b34"/>
      <stop offset="1" stop-color="#13142b"/>
    </linearGradient>
    <!-- Down the boom: purple at the top to turquoise at the foot. -->
    <linearGradient id="lk" x1="0" y1="4" x2="0" y2="128.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9d00ac"/>
      <stop offset="0.28" stop-color="#9a05ae"/>
      <stop offset="0.51" stop-color="#7945b5"/>
      <stop offset="0.73" stop-color="#5b7ebc"/>
      <stop offset="0.9" stop-color="#46a9c2"/>
      <stop offset="1" stop-color="#33ccc6"/>
    </linearGradient>
    <!-- Foam mic: lighter top half, darker bottom. -->
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.52" stop-color="#2a6273"/>
      <stop offset="0.52" stop-color="#0c2832"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <!-- The boom L: a stem leaning like a boom swung out, the foot ending in the mic. -->
  <g transform="translate(256 256) scale(2.4) translate(-30.5 -70)">
    <path d="M-6 4H7Q11 4 11.6 8L21 100Q21 108.5 27 108.5H52V128.5H14Q0 128.5 -0.5 114.5L-10 8Q-10 4 -6 4Z" fill="url(#lk)"/>
    <path d="M50 103H60.5A10.5 16.5 0 0 1 60.5 136H50Z" fill="url(#mic)"/>
  </g>
</svg>
