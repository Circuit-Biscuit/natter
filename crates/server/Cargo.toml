[package]
name = "laklak-server"
description = "Laklak server: HTTP API, WebSocket gateway, SQLite storage and call SFU in one binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
futures-util = "0.3.34"
httpdate = "1"
data-encoding = "2.11"
hex = "0.4.3"
hmac = "0.13"
imagesize = "0.15.0"
laklak-proto = { path = "../proto" }
percent-encoding = "2.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
socket2 = "0.6.5"
serde_json = "1.0.154"
sha1 = "0.11"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit", "fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "file-transport"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
