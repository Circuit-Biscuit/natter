[package]
name = "laklak-denoise"
description = "AI noise suppression for calls: RNNoise (nnnoiseless) as a small wasm module for an AudioWorklet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib: laklak_denoise.wasm, built by the app's Trunk hook and loaded by crates/app/denoise.js.
crate-type = ["cdylib", "rlib"]

[dependencies]
nnnoiseless = { version = "0.5.2", default-features = false }
