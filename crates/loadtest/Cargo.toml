[package]
name = "laklak-loadtest"
description = "Load generator for a Laklak server: chat users on the gateway and call participants through the SFU"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
laklak-proto = { path = "../proto" }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1.0.229"
serde_json = "1.0.154"
str0m = { version = "0.25.0", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.29"
