# Publishes a release whenever the version in Cargo.toml ([workspace.package]) goes up.
#
#   1. add a "## [x.y.z]" section to CHANGELOG.md, then run scripts/bump.ps1 x.y.z
#   2. push to main
#   3. this workflow sees there's no tag vx.y.z yet, builds the desktop installers for Windows, macOS and Linux
#      plus the Linux server bundle into a draft release vx.y.z, then publishes it with checksums and latest.json,
#      the signed update manifest installed desktop apps check (signing key: the TAURI_SIGNING_PRIVATE_KEY secret,
#      public key in crates/desktop/tauri.conf.json).
#   4. meanwhile, locally (the Android signing key never comes here): scripts/android-release.ps1 builds the APK and
#      the Google Play bundle, attaches the APK to this draft before it's published (so it's in SHA256SUMS) and
#      uploads the bundle to Google Play's internal testing track with fastlane. See docs/DEPLOY.md › Releasing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            # Every release gets its changelog as its release notes: no section, no release.
            grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # Builds upload straight into a draft release (no Actions artifact storage, which has a shared quota).
      - if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 ||             gh release create "v$VERSION" --draft --title "Natter $VERSION" --notes "Building…" --target "$GITHUB_SHA"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    # macOS has never been tried on a real Mac yet (and runner images get retired); don't let it block the release.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            files: target/release/bundle/nsis/*.exe*
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: Linux
            os: ubuntu-22.04
            args: ""
            files: target/release/bundle/appimage/*.AppImage* target/release/bundle/deb/*.deb*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      # Also signs each installer (.sig) for the in-app updater.
      # (`-c`, not TAURI_CONFIG: the bundler only reads the flag.)
      - run: cargo tauri build ${{ matrix.args }} -c '{"bundle":{"createUpdaterArtifacts":true}}'
        working-directory: crates/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.version.outputs.version }}" ${{ matrix.files }} --clobber

  server:
    name: Server (Linux x86_64, static)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p natter-server --target x86_64-unknown-linux-musl
      - run: trunk build --release
        working-directory: crates/app
      - run: |
          mkdir -p natter
          cp target/x86_64-unknown-linux-musl/release/natter-server natter/
          cp -r crates/app/dist natter/web
          cp docs/DEPLOY.md natter/
          tar -czf "natter-server-$VERSION-linux-x86_64.tar.gz" natter
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" natter-server-*.tar.gz --clobber

  publish:
    name: Publish release
    needs: [version, desktop, server]
    if: ${{ !cancelled() && needs.server.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## [$VERSION]" 'index($0, v) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          cat notes.md
          [ -s notes.md ]
      - name: Update manifest, checksums and publish
        run: |
          gh release download "v$VERSION" --dir out --skip-existing
          # latest.json: what installed desktop apps download (releases/latest/download/latest.json), per platform.
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          platforms='{}'
          add() {  # platform, installer (skipped unless it has a .sig)
            [ -f "$2" ] && [ -f "$2.sig" ] || return 0
            sig=$(cat "$2.sig")
            url="$base/$(basename "$2")"
            platforms=$(jq --arg k "$1" --arg url "$url" --arg sig "$sig" '.[$k] = {url: $url, signature: $sig}' <<<"$platforms")
          }
          for f in out/*-setup.exe; do add windows-x86_64 "$f"; done
          for f in out/*.AppImage; do add linux-x86_64 "$f"; done
          for f in out/*.deb; do add linux-x86_64-deb "$f"; done
          for f in out/*.app.tar.gz; do add darwin-aarch64 "$f"; add darwin-x86_64 "$f"; done
          jq -n --arg v "$VERSION" --argjson p "$platforms" '{version: $v, platforms: $p}' > out/latest.json
          cat out/latest.json
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release upload "v$VERSION" out/latest.json out/SHA256SUMS.txt --clobber
          gh release edit "v$VERSION" --draft=false --notes-file notes.md
